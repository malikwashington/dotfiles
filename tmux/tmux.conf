# tmux.conf — tracked in dotfiles. Linked to ~/.config/tmux/tmux.conf (tmux >= 3.1 reads it there).
# No plugins; works on a fresh install with just tmux.

# ---------- prefix: Ctrl+Space ----------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix          # press twice to send Ctrl+Space through (nested tmux, etc.)

# ---------- terminal / colors ----------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true color
set -s escape-time 0                        # no delay after Esc (vim)
set -g focus-events on
set -g history-limit 50000

# ---------- general ----------
set -g mouse on
set -g base-index 1                         # windows start at 1
setw -g pane-base-index 1                   # panes start at 1
set -g renumber-windows on                  # close a window, renumber the rest
set -g set-clipboard on                     # copy to system clipboard via terminal (OSC 52)
setw -g mode-keys vi

# ---------- reload ----------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ---------- windows / panes (open in current directory) ----------
bind c new-window      -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim-style pane resize (repeatable: hold prefix, tap again)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# quick window switching
bind -r C-h previous-window
bind -r C-l next-window
bind Space last-window

# ---------- copy mode (vi) ----------
bind Enter copy-mode
bind -T copy-mode-vi v     send-keys -X begin-selection
bind -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind -T copy-mode-vi y     send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# ---------- status bar ----------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour250"
set -g status-left  "#[bold] #S #[nobold]│ "
set -g status-left-length 30
set -g status-right " %a %d %b │ %H:%M "
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[bold,fg=colour214] #I:#W "
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour214"
set -g message-style "bg=colour214,fg=colour235"
